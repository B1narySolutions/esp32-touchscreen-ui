function irCurve(irName, lowcut, highcut, W, H, color) {
  const p = IR_PARAMS[irName] || IR_PARAMS['4x12 Greenback'];
  const userLo = 20 * Math.pow(15, lowcut / 100);
  const userHi = 3000 * Math.pow(6.5, highcut / 100);
  const lo = Math.log10(20), span = Math.log10(20000) - lo;
  const db = (f) => {
    let d = -10 * Math.log10(1 + Math.pow(p.lo / f, 4)) - 10 * Math.log10(1 + Math.pow(f / p.hi, 6));
    d += -10 * Math.log10(1 + Math.pow(userLo / f, 4)) - 10 * Math.log10(1 + Math.pow(f / userHi, 6));
    p.peaks.forEach((k) => { d += k.g * Math.exp(-0.5 * Math.pow(Math.log2(f / k.f) / k.w, 2)); });
    return d;
  };
  const yOf = (d) => Math.max(0, Math.min(H, ((10 - d) / 46) * H));
  let path = '';
  for (let i = 0; i <= 80; i++) {
    const f = Math.pow(10, lo + (span * i) / 80);
    path += (i ? 'L' : 'M') + ((i / 80) * W).toFixed(1) + ' ' + yOf(db(f)).toFixed(1);
  }
  const xOf = (f) => ((Math.log10(f) - lo) / span) * W;
  return { line: path, area: path + `L${W} ${H}L0 ${H}Z`, zeroY: yOf(0), grid: [100, 1000, 10000].map((f) => ({ x: xOf(f), label: f >= 1000 ? f / 1000 + 'k' : String(f) })), color };
}

function ringStyle(color, value, size) {
  const sweep = (value * 0.75).toFixed(2);
  return `width:${size}px;height:${size}px;border-radius:50%;background:conic-gradient(from -135deg, ${color} 0%, ${color} ${sweep}%, #33333a ${sweep}%, #33333a 75%, transparent 75%, transparent 100%);`;
}
function knobSize(count) { return count <= 2 ? 148 : count === 3 ? 132 : count === 4 ? 118 : 104; }
function estimateOutLevel(def, values) {
  for (const c of ['level', 'gain', 'mix']) {
    if (def.knobs.some((k) => k.key === c)) return values[c];
  }
  const keys = def.knobs.map((k) => k.key);
  return keys.length ? Math.round(keys.reduce((a, k) => a + values[k], 0) / keys.length) : 50;
}
function switchStyle(on) {

}

      backlight: 80,

      bleOn: true,

      scale: 1,
      testOpen: false,
      serialState: 'idle',
      serialError: '',
      diag: null,
      diagAt: 0,
      now: Date.now()
    };
    this.port = null;
    this.reader = null;
    this.onResize = () => {
      this.setState({ scale: Math.min(window.innerWidth / BASE_W, window.innerHeight / BASE_H) });
    };
  }

  componentDidMount() {
    this.onResize();
    window.addEventListener('resize', this.onResize);
    this.clock = setInterval(() => { if (this.state.testOpen) this.setState({ now: Date.now() }); }, 1000);
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
    clearInterval(this.clock);
    this.disconnectDevice();
  }

  connectDevice = async () => {
    if (!('serial' in navigator)) {
      this.setState({ serialState: 'error', serialError: 'This browser has no Web Serial. Use Chrome or Edge on a computer.' });
      return;
    }
    try {
      this.port = await navigator.serial.requestPort();
      await this.port.open({ baudRate: 115200 });
      // Opening toggles DTR/RTS, which is wired to EN/BOOT on ESP32 boards; release them so it runs.
      await this.port.setSignals({ dataTerminalReady: false, requestToSend: false });
      this.setState({ serialState: 'connected', serialError: '' });
      this.readLoop();
    } catch (err) {
      this.port = null;
      if (err && err.name === 'NotFoundError') return;
      this.setState({ serialState: 'error', serialError: String(err && err.message || err) });
    }
  };

  readLoop = async () => {
    const decoder = new TextDecoder();
    let buf = '';
    try {
      while (this.port && this.port.readable) {
        this.reader = this.port.readable.getReader();
        try {
          for (;;) {
            const { value, done } = await this.reader.read();
            if (done) break;
            buf += decoder.decode(value, { stream: true });
            let nl;
            while ((nl = buf.indexOf('\n')) >= 0) {
              const line = buf.slice(0, nl).trim();
              buf = buf.slice(nl + 1);
              const at = line.indexOf('DIAG {');
              if (at < 0) continue;
              try { this.setState({ diag: JSON.parse(line.slice(at + 5)), diagAt: Date.now() }); } catch (_) {}
            }
          }
        } finally {
          this.reader.releaseLock();
          this.reader = null;
        }
      }
    } catch (err) {
      this.setState({ serialState: 'error', serialError: 'Lost connection to the board: ' + (err && err.message || err) });
    }
  };

  disconnectDevice = async () => {
    try { if (this.reader) await this.reader.cancel(); } catch (_) {}
    try { if (this.port) await this.port.close(); } catch (_) {}
    this.port = null;
    this.setState({ serialState: 'idle', diag: null });
  };

  diagnostics(s) {
    const d = s.diag;
    const dash = '—';
    const kb = (b) => `${Math.round(b / 1024)} KB`;
    const hms = (t) => `${String(Math.floor(t / 3600)).padStart(2, '0')}:${String(Math.floor(t / 60) % 60).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`;
    // Fields newer firmware adds; older builds simply don't send them, so show a dash.
    const has = (k) => d && d[k] !== undefined;
    const ui = d && d.ui;
    const esp = [
      ['Firmware', has('fw') ? `${d.fw}  #${d.elf}` : dash],
      ['Uptime', d ? hms(d.up) : dash],
      ['Reset reason', d ? d.rst : dash],
      ['ESP-IDF', d ? d.idf : dash],
      ['CPU load (core 0 / 1)', has('cpu') ? (d.cpu[0] === null ? 'run-time stats off' : `${d.cpu[0].toFixed(0)} % / ${d.cpu[1].toFixed(0)} %`) : dash],
      ['Free internal heap', d ? kb(d.heap) : dash],
      ['Min free heap (since boot)', d ? kb(d.heap_min) : dash],
      ['Largest free block', d ? kb(d.heap_big) : dash],
      ['Free PSRAM', d ? `${(d.psram / 1048576).toFixed(2)} MB of ${(d.psram_total / 1048576).toFixed(2)} MB` : dash],
      ['Chip temperature', d ? (d.temp === null ? 'sensor unavailable' : `${d.temp.toFixed(1)} °C`) : dash],
      ['Battery', d ? (d.vbat < 0 ? 'read failed' : `${d.vbat.toFixed(2)} V` + (has('vbat_min') && d.vbat_min >= 0 ? `  (${d.vbat_min.toFixed(2)} – ${d.vbat_max.toFixed(2)}, 10 s)` : '')) : dash],
      ['Backlight PWM', d ? `${d.bl} %` : dash],
      ['Display', d ? (has('panel_hz') ? `${d.panel_hz.toFixed(1)} Hz panel, ${d.fps} frames/s` : `${d.fps} frames/s`) : dash],
      ['Frame time (avg / max)', ui ? (d.fps === 0 ? 'idle' : `${ui.frame_avg.toFixed(1)} / ${ui.frame_max.toFixed(1)} ms`) : dash],

    ];

    const on = !!(sd && sd.conn);
    const seed = [
      ['Link', d ? (on ? 'Connected' : 'Not connected') : dash],
      ['Packets TX / RX', on ? `${sd.tx} / ${sd.rx}` : dash],
      ['Link errors', on ? String(sd.err) : dash],

  selectEffect = (id) => () => {

  onDragStart = (idx) => (e) => {

    this.setState({ draggedIndex: idx });
  };
  onDragOver = (idx) => (e) => {
    e.preventDefault();
    this.setState((s) => {
      if (s.draggedIndex === null || s.draggedIndex === idx) return null;
      const order = s.chainOrder.slice();
      const moved = order.splice(s.draggedIndex, 1)[0];
      order.splice(idx, 0, moved);
      return { chainOrder: order, draggedIndex: idx, dirty: true };
    });
  };
  onDrop = (e) => { e.preventDefault(); this.setState({ draggedIndex: null }); };
  onDragEnd = () => { this.setState({ draggedIndex: null }); };

  openSlider = (effectId, knobKey, label, color) => () => {
    const value = this.state.knobValues[effectId][knobKey];
    this.setState({ activeSlider: { effectId, knobKey, label, color, value } });
  };
  closeSlider = () => this.setState({ activeSlider: null });

      const kvals = JSON.parse(JSON.stringify(s.knobValues));

  applyPreset = (preset) => () => {

      chainOrder: preset.chainOrder.slice(), effectState, knobValues, models,
      selectedId: preset.chainOrder[0], presetName: preset.name, presetsOpen: false, dirty: false

      if (inChain) {
        if (order.length <= 1) return null;
        order = order.filter((x) => x !== id);
        if (selectedId === id) selectedId = order[0];

      </div>
      <div style="padding:14px 22px 0;border-top:1px solid #24242a;">
        <div style="${monoLabel}font-size:9.5px;letter-spacing:.12em;color:#5a5852;margin-bottom:8px;">DEVELOPER</div>
        <button onClick=${() => this.setState({ presetsOpen: false, testOpen: true })} style="${btnReset}display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 14px;border-radius:10px;background:#211c1c;border:1px solid #3a2a2a;">
          <span style="font-size:13px;font-weight:700;color:#e2705c;">Test Mode</span>
          <span style="${monoLabel}font-size:9.5px;color:#8f8b82;">ESP32 + SEED3</span>
        </button>
      </div>
    </div>
  </div>`}

  ${s.testOpen && (() => {
    const d = this.diagnostics(s);
    const row = ([k, v]) => html`<div key=${k} style="display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #1f1f24;">
      <span style="font-size:11.5px;color:#8f8b82;">${k}</span>
      <span style="${monoLabel}font-size:11.5px;color:#eee8dd;text-align:right;">${v}</span>
    </div>`;
    const panel = 'flex:1;min-width:0;background:#16161a;border:1px solid #26262c;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;';
    const head = (title, sub, dot) => html`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
      <div style="width:8px;height:8px;border-radius:50%;background:${dot};"></div>
      <span style="font-size:13px;font-weight:800;letter-spacing:.04em;">${title}</span>
      <span style="${monoLabel}font-size:9.5px;color:#5a5852;">${sub}</span>
    </div>`;
    const live = s.serialState === 'connected';
    const age = s.diag ? Math.round((s.now - s.diagAt) / 1000) : null;
    const stale = age !== null && age > 3;
    const status = !live ? 'Not connected to a board'
      : !s.diag ? 'Connected · waiting for data from the board…'
      : stale ? `Connected · no data for ${age}s` : 'Live · updating every second';
    const statusColor = !live ? '#8f8b82' : (!s.diag || stale) ? '#e8c463' : '#7fd9a8';
    return html`<div style="position:absolute;inset:0;z-index:150;background:#0e0e11;display:flex;flex-direction:column;padding:16px 22px;gap:12px;">
      <div style="display:flex;align-items:center;gap:12px;">
        <span style="${monoLabel}font-size:10px;letter-spacing:.1em;color:#101013;background:#e2705c;padding:4px 9px;border-radius:5px;font-weight:700;">TEST MODE</span>
        <span style="font-size:15px;font-weight:800;">Diagnostics</span>
        <div style="width:7px;height:7px;border-radius:50%;background:${statusColor};"></div>
        <span style="${monoLabel}font-size:10px;color:${statusColor};">${status}</span>
        <div style="flex:1;"></div>
        <button onClick=${live ? this.disconnectDevice : this.connectDevice} style="${btnReset}background:#1c1c21;border:1px solid #2c2c33;color:#d8d4c9;font-weight:700;font-size:12px;padding:9px 16px;border-radius:9px;">${live ? 'Disconnect' : 'Connect board (USB)'}</button>
        <button onClick=${() => this.setState({ testOpen: false })} style="${btnReset}background:#e8b463;color:#161409;font-weight:700;font-size:12px;padding:9px 16px;border-radius:9px;">Exit Test Mode</button>
      </div>
      ${s.serialError && html`<div style="font-size:11px;color:#e2705c;background:#231616;border-radius:8px;padding:8px 12px;">${s.serialError}</div>`}
      ${!live && !s.serialError && html`<div style="font-size:11px;line-height:1.5;color:#8f8b82;background:#16161a;border:1px solid #26262c;border-radius:8px;padding:8px 12px;">
        This page shows real readings from the board, nothing simulated. Plug the board's <b style="color:#d8d4c9;">USB TO UART</b> port into this computer, click <b style="color:#d8d4c9;">Connect board (USB)</b> and pick its COM port. Needs Chrome or Edge on a computer. Close any serial monitor first, since only one program can use the port at a time.
      </div>`}
      <div style="flex:1;display:flex;gap:12px;min-height:0;">
        <div style="${panel}">
          ${head('ESP32-S3', 'UI BOARD', s.diag && !stale ? '#7fd9a8' : '#4a4850')}
          <div style="overflow-y:auto;">${d.esp.map(row)}</div>
        </div>
        <div style="${panel}">
          ${head('SEED3 · NAM', 'DSP BOARD', d.seedOn ? '#7fd9a8' : '#e2705c')}
          ${s.diag && !d.seedOn && html`<div style="font-size:10.5px;line-height:1.4;color:#e2a05c;background:#231d16;border-radius:8px;padding:8px 10px;margin:4px 0 6px;">The board reports no link to the Daisy Seed yet. These fields fill in once the ESP32 ↔ SEED3 link is wired and its protocol is implemented.</div>`}
          <div style="overflow-y:auto;">${d.seed.map(row)}</div>
        </div>
      </div>
      <div style="${monoLabel}font-size:9.5px;color:#5a5852;">Touch test, colour bars and the backlight check run on the board's own Test Mode screen (Menu → Test Mode); their results show up here.</div>
    </div>`;
  })()}

  ${s.catalogOpen && html`<div onClick=${() => this.setState({ catalogOpen: false })} style="${backdrop}align-items:center;justify-content:center;">
    <div onClick=${this.stop} style="${cardBase}width:420px;max-height:480px;padding:24px;display:flex;flex-direction:column;gap:14px;">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <span style="font-size:16px;font-weight:800;">Add / Remove Effects</span>
        ${closeX(() => this.setState({ catalogOpen: false }), 'font-size:15px;color:#78746c;')}
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;overflow-y:auto;">
        ${ALL_EFFECT_IDS.map((id) => {
          const def = EFFECTS[id];
          const inChain = s.chainOrder.indexOf(id) !== -1;
          return html`<button key=${id} onClick=${this.toggleCatalogEffect(id)} style="${btnReset}display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;background:#212126;">
            <div style="width:9px;height:9px;border-radius:3px;background:${def.color};flex-shrink:0;"></div>
            <span style="flex:1;font-size:13px;font-weight:600;color:#d8d4c9;">${def.label}</span>
            <span style="${monoLabel}font-size:9.5px;letter-spacing:.05em;padding:4px 9px;border-radius:6px;${inChain ? `background:${def.color};color:#101013;font-weight:700;` : 'background:#2c2c33;color:#9c988e;'}">${inChain ? 'IN CHAIN' : 'ADD'}</span>
          </button>`;
        })}
      </div>
      <div style="font-size:10px;color:#5a5852;text-align:center;">tap outside to close · more than 7 effects scroll horizontally in the chain</div>
    </div>
  </div>`}

</div>
</div>`;
  }
}

render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
